name: orderlane_pro
description: "OrdWave — Offline-first, Credit-first OMS for FMCG Distributors"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Networking ────────────────────────────────────────────────────────────
  dio: ^5.9.2

  # ── State Management ─────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Navigation ───────────────────────────────────────────────────────────
  go_router: ^14.8.1

  # ── Local Database (Offline-first) ───────────────────────────────────────
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.0
  path: ^1.9.0

  # ── Secure Storage ────────────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.4

  # ── Preferences ──────────────────────────────────────────────────────────
  shared_preferences: ^2.3.0

  # ── Code Generation (Freezed) ─────────────────────────────────────────────
  freezed_annotation: ^2.4.4

  # ── Connectivity ──────────────────────────────────────────────────────────
  connectivity_plus: ^6.1.5

  # ── Background Sync ───────────────────────────────────────────────────────
  workmanager: ^0.5.2

  # ── Notifications ─────────────────────────────────────────────────────────
  flutter_local_notifications: ^17.2.4
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.4

  # ── Media ─────────────────────────────────────────────────────────────────
  image_picker: ^1.1.0

  # ── App Info ──────────────────────────────────────────────────────────────
  package_info_plus: ^8.1.1

  # ── URL Launcher ──────────────────────────────────────────────────────────
  url_launcher: ^6.3.1

  # ── UI Utilities ──────────────────────────────────────────────────────────
  flutter_svg: ^2.2.0
  equatable: ^2.0.8
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # ── Code Generation ────────────────────────────────────────────────────────
  build_runner: ^2.4.0
  drift_dev: ^2.28.0
  riverpod_generator: ^2.6.4
  freezed: ^2.5.8

  # ── App Icon + Splash Generation ──────────────────────────────────────────
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3

# ── App Icon Config (run: dart run flutter_launcher_icons) ────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/icons/app_icon.png'
  adaptive_icon_background: '#1B4332'
  adaptive_icon_foreground: 'assets/icons/app_icon_foreground.png'
  min_sdk_android: 21
  web:
    generate: false

# ── Splash Screen Config (run: dart run flutter_native_splash:create) ─────────
flutter_native_splash:
  color: '#1B4332'
  color_dark: '#1B4332'
  image: assets/images/splash_logo.png
  image_dark: assets/images/splash_logo.png
  android_12:
    color: '#1B4332'
    color_dark: '#1B4332'
    image: assets/images/splash_logo.png
  android: true
  ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
