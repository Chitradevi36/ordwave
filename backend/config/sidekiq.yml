---
# Sidekiq process concurrency (default 10; tune per dyno/VM RAM)
:concurrency: 10

# Queue order: higher weight = more frequently polled
:queues:
  - [critical,  3]   # invoice PDFs, webhook delivery, push notifications
  - [invoicing, 3]   # auto-invoice generation from delivery stops
  - [default,   2]   # most background jobs
  - [low,       1]   # exports, report generation, beat scheduling
  - [billing,   2]   # billing lifecycle jobs

# Dead job retention
:dead_max_jobs: 10_000
:dead_timeout_in_seconds: 2_592_000   # 30 days

# Retry configuration (Sidekiq default is 25; lower for noisy queues if needed)
:max_retries: 25

# Log level (debug | info | warn | error)
:log_level: info

# ── Recurring jobs (sidekiq-cron) ────────────────────────────────────────────
:cron_jobs:
  accounting_agent_heartbeat:
    cron: '*/5 * * * *'         # every 5 minutes
    class: 'AccountingAgentHeartbeatJob'
    queue: default
    description: 'Mark accounting agents offline when heartbeat is stale'

  credit_limit_sla_breach:
    cron: '*/30 * * * *'        # every 30 minutes
    class: 'CreditLimitSlaBreachJob'
    queue: default
    description: 'Stamp sla_breached_at on overdue credit-limit change requests'

  check_low_stock:
    cron: '0 2 * * *'           # 2 AM daily
    class: 'CheckLowStockJob'
    queue: low
    args: []                    # nil = all organisations
    description: 'Notify warehouse staff when stock falls below min_qty_threshold'

  batch_risk_recompute:
    cron: '0 3 * * *'           # 3 AM daily
    class: 'BatchRiskRecomputeJob'
    queue: low
    description: 'Refresh retailer risk snapshots for all active retailers'

  billing_past_due_expiry:
    cron: '0 1 * * *'           # 1 AM daily
    class: 'Billing::PastDueExpiryJob'
    queue: billing
    description: 'Downgrade orgs whose payment grace period has expired'

  billing_past_due_reminder:
    cron: '0 10 * * *'          # 10 AM daily
    class: 'Billing::PastDueReminderJob'
    queue: billing
    description: 'Send payment reminder to orgs in past_due billing status'
  dunning_sequence:
    cron: '0 8 * * *'           # 8 AM daily
    class: 'DunningSequenceJob'
    queue: default
    description: 'Send dunning reminders for overdue invoices (day 1, 5, 10)'

  payment_retry:
    cron: '0 1 * * *'           # 1 AM daily
    class: 'PaymentRetryJob'
    queue: billing
    description: 'Retry failed payments (attempt 1, 2, 3 at 24h, 48h, 72h intervals)'

  bank_reconciliation:
    cron: '0 5 * * *'           # 5 AM daily
    class: 'BankReconciliationJob'
    queue: default
    description: 'Run bank transaction matching and auto-post confirmed matches'

  delivery_escalation_action:
    cron: '0 7 * * *'           # 7 AM daily
    class: 'DeliveryEscalationActionJob'
    queue: operations
    description: 'Handle escalated deliveries: send options, auto-refund, alert manager'
  auto_assign_trips:
    cron: '0 18 * * *'          # 6 PM daily (end of business)
    class: 'AutoAssignTripsJob'
    queue: operations
    description: 'Auto-assign all approved orders to optimal trips or create new trips'